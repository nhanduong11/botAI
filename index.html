<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Desk Robot AI</title>

  <!-- MediaPipe Face Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070a12;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      touch-action: manipulation;
    }

    /* Video camera ngầm */
    #webcam {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* Khung khuôn mặt */
    .face-socket {
      display: flex;
      gap: 60px;
      align-items: center;
      justify-content: center;
      width: 320px;
      height: 220px;
      cursor: pointer;
    }

    /* Đôi mắt robot OLED */
    .eye {
      width: 85px;
      height: 135px;
      background: #00f2fe;
      border-radius: 45px;
      box-shadow: 0 0 25px #00f2fe, 0 0 50px rgba(0, 242, 254, 0.4);
      transition: transform 0.08s ease-out, height 0.15s ease-in-out, background 0.3s;
      will-change: transform;
    }

    /* Chớp mắt */
    .blink {
      height: 12px !important;
    }

    /* Đang nghe: Mắt tròn xanh lá */
    .listening .eye {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #38ef7d;
      box-shadow: 0 0 35px #38ef7d;
    }

    /* Đang suy nghĩ: Mắt dẹt màu vàng */
    .thinking .eye {
      height: 35px;
      background: #fbc531;
      box-shadow: 0 0 30px #fbc531;
    }

    /* Đang nói: Mắt chuyển động nhịp */
    .speaking .eye {
      background: #ff4757;
      box-shadow: 0 0 35px #ff4757;
      animation: speak-pulse 0.4s infinite alternate;
    }

    @keyframes speak-pulse {
      0% { transform: scaleY(0.75); }
      100% { transform: scaleY(1.15); }
    }

    /* Trạng thái văn bản */
    .status-text {
      margin-top: 35px;
      font-size: 16px;
      color: #00f2fe;
      text-align: center;
      max-width: 90%;
      min-height: 55px;
      line-height: 1.5;
      padding: 0 10px;
      white-space: pre-line;
    }

    /* Khung nhập API Key */
    .config-box {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 8px;
      width: 92%;
      max-width: 460px;
      z-index: 10;
    }
    .config-box input {
      flex: 1;
      min-width: 0;
      background: rgba(30, 39, 46, 0.85);
      border: 1px solid #485460;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .config-box button {
      background: #00f2fe;
      color: #070a12;
      border: none;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .config-box button.ghost {
      background: transparent;
      color: #00f2fe;
      border: 1px solid #00f2fe;
    }
  </style>
</head>
<body>

  <!-- Video camera ngầm -->
  <video id="webcam" playsinline autoplay muted></video>

  <!-- Khuôn mặt Robot -->
  <div class="face-socket" id="faceSocket" onclick="startContinuousMode()">
    <div class="eye" id="leftEye"></div>
    <div class="eye" id="rightEye"></div>
  </div>

  <div class="status-text" id="statusLabel">Chạm vào màn hình 1 lần để đánh thức Robot</div>

  <!-- Khung nhập API Key -->
  <div class="config-box">
    <input type="password" id="apiKeyInput" placeholder="Nhập hoặc dán Gemini API Key..." autocomplete="off">
    <button onclick="saveApiKey()">Lưu Key</button>
    <button class="ghost" onclick="testSpeaker()">Thử loa</button>
  </div>

  <script>
    const webcamElement = document.getElementById('webcam');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const faceSocket = document.getElementById('faceSocket');
    const statusLabel = document.getElementById('statusLabel');
    const apiKeyInput = document.getElementById('apiKeyInput');

    // Chỉ đọc key mà chính điện thoại này đã lưu. Không để sẵn key trong file.
    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        alert('Đã lưu API Key thành công!');
      }
    }

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // iPhone chỉ cho phát giọng nói sau một lần chạm của người dùng, nên "mở khóa" ngay trong lần chạm đó
    function unlockSpeech() {
      try {
        if (window.speechSynthesis) {
          const u = new SpeechSynthesisUtterance('');
          u.volume = 0;
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
    }

    let currentX = 0;
    let currentY = 0;
    const MAX_OFFSET_X = 35;
    const MAX_OFFSET_Y = 25;

    // 1. TỰ ĐỘNG CHỚP MẮT
    function triggerBlink() {
      if (!faceSocket.classList.contains('speaking') && !faceSocket.classList.contains('thinking')) {
        leftEye.classList.add('blink');
        rightEye.classList.add('blink');
        setTimeout(() => {
          leftEye.classList.remove('blink');
          rightEye.classList.remove('blink');
        }, 160);
      }
      setTimeout(triggerBlink, Math.random() * 4000 + 2500);
    }
    triggerBlink();

    // 2. FACE TRACKING (MEDIAPIPE)
    function onFaceResults(results) {
      if (results.detections && results.detections.length > 0) {
        const bbox = results.detections[0].boundingBox;
        const faceCenterX = bbox.xCenter;
        const faceCenterY = bbox.yCenter;

        const targetOffsetX = (0.5 - faceCenterX) * 2 * MAX_OFFSET_X;
        const targetOffsetY = (faceCenterY - 0.5) * 2 * MAX_OFFSET_Y;

        currentX += (targetOffsetX - currentX) * 0.35;
        currentY += (targetOffsetY - currentY) * 0.35;

        if (!faceSocket.classList.contains('speaking')) {
          const transformValue = `translate(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px)`;
          leftEye.style.transform = transformValue;
          rightEye.style.transform = transformValue;
        }
      } else {
        currentX += (0 - currentX) * 0.1;
        currentY += (0 - currentY) * 0.1;
        if (!faceSocket.classList.contains('speaking')) {
          leftEye.style.transform = `translate(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px)`;
          rightEye.style.transform = `translate(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px)`;
        }
      }
    }

    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({
      model: 'short',
      minDetectionConfidence: 0.5
    });
    faceDetection.onResults(onFaceResults);

    const camera = new Camera(webcamElement, {
      onFrame: async () => {
        await faceDetection.send({ image: webcamElement });
      },
      facingMode: 'user',
      width: 480,
      height: 360
    });

    camera.start().catch((err) => {
      console.warn("Lỗi camera:", err);
    });

    // 3. GIỌNG NÓI TIẾNG VIỆT (TTS)
    function pickVietnameseVoice() {
      if (!window.speechSynthesis) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const vi = voices.filter((v) => /^vi([-_]|$)/i.test(v.lang || ''));
      return vi.find((v) => v.lang.replace('_', '-').toLowerCase() === 'vi-vn') || vi[0] || null;
    }
    // Danh sách giọng của một số máy chỉ có sau khi tải xong, nên gọi lại khi nó thay đổi
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // 4. THU ÂM VÀ LẮNG NGHE LIÊN TỤC
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let recognizing = false;     // micro đang mở
    let micStarting = false;     // đã gọi start() nhưng chưa mở xong
    let isBotSpeaking = false;
    let isProcessing = false;    // đang chờ AI trả lời (micro phải đóng hẳn)
    let isContinuousActive = false;
    let silenceTimer = null;
    let recognizedText = "";
    let currentUtterance = null; // giữ tham chiếu để trình duyệt không thu hồi giữa chừng
    let speakToken = 0;
    let micEndWaiters = [];

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.interimResults = true;
      recognition.continuous = true;

      recognition.onstart = () => {
        micStarting = false;
        recognizing = true;
        if (!isBotSpeaking && !isProcessing) {
          setMode('listening', 'Đang nghe xếp nói...');
        }
      };

      recognition.onresult = (event) => {
        // Bỏ qua kết quả đến muộn hoặc tiếng của chính robot
        if (isBotSpeaking || isProcessing) return;

        let currentTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          currentTranscript += event.results[i][0].transcript;
        }

        if (currentTranscript.trim().length > 0) {
          recognizedText = currentTranscript.trim();
          statusLabel.innerText = `Đang nghe: "${recognizedText}"`;

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (recognizedText.length > 0) {
              const textToSend = recognizedText;
              recognizedText = "";
              triggerProcessQuery(textToSend);
            }
          }, 1100);
        }
      };

      recognition.onerror = (event) => {
        micStarting = false;
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          isContinuousActive = false;
          statusLabel.innerText = 'Chưa cấp quyền Micro! Hãy cho phép micro rồi chạm vào màn hình.';
        }
      };

      recognition.onend = () => {
        micStarting = false;
        recognizing = false;
        micEndWaiters.splice(0).forEach((fn) => fn());
        if (isContinuousActive && !isBotSpeaking && !isProcessing) {
          setTimeout(restartListening, 250);
        }
      };
    }

    function restartListening() {
      if (!recognition || !isContinuousActive || isBotSpeaking || isProcessing || recognizing || micStarting) return;
      try {
        micStarting = true;
        recognition.start();
      } catch (err) {
        micStarting = false;
      }
    }

    // Đóng micro và CHỜ nó đóng hẳn. Nếu micro còn mở khi robot bắt đầu nói,
    // điện thoại sẽ hạ nhỏ hoặc tắt hẳn tiếng loa.
    function stopListeningAndWait(timeoutMs = 900) {
      return new Promise((resolve) => {
        if (!recognition || (!recognizing && !micStarting)) return resolve();
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        micEndWaiters.push(finish);
        setTimeout(finish, timeoutMs);
        try { recognition.abort(); } catch (e) { finish(); }
      });
    }

    function startContinuousMode() {
      unlockSpeech();
      if (!SpeechRecognition) {
        statusLabel.innerText = 'Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy dùng Chrome (Android) hoặc Safari (iPhone).';
        return;
      }
      if (!isContinuousActive) {
        isContinuousActive = true;
        speak('Em nghe đây xếp.');
      } else {
        restartListening();
      }
    }

    async function triggerProcessQuery(text) {
      if (isProcessing || isBotSpeaking) return;
      isProcessing = true;
      clearTimeout(silenceTimer);
      recognizedText = "";
      setMode('thinking', `Xếp: "${text}"`);
      await stopListeningAndWait();
      await callGemini(text);
    }

    function setMode(mode, statusMsg) {
      faceSocket.className = 'face-socket ' + (mode === 'idle' ? '' : mode);
      if (statusMsg) statusLabel.innerText = statusMsg;
    }

    // 5. GỌI GEMINI API
    // Gemini 2.5 không còn mở cho key mới (báo lỗi 404), nên thử lần lượt các model hiện hành
    const GEMINI_MODELS = ['gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-2.5-flash'];

    async function callGemini(prompt) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        speak('Xếp chưa nhập API Key kìa.');
        return;
      }

      const saved = localStorage.getItem('gemini_model');
      const models = saved ? [saved, ...GEMINI_MODELS.filter((m) => m !== saved)] : GEMINI_MODELS;
      const payload = {
        system_instruction: {
          parts: [{
            text: "Bạn là một robot để bàn thông minh và lễ phép. Luôn xưng hô gọi người dùng là 'xếp'. Phản hồi cực kỳ ngắn gọn, tự nhiên và súc tích (chỉ từ 1 đến 2 câu ngắn) để đọc rõ ràng qua loa điện thoại."
          }]
        },
        contents: [{ role: "user", parts: [{ text: prompt }] }]
      };

      let lastError = '';
      for (const model of models) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        let res;
        try {
          res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
        } catch (e) {
          clearTimeout(timeout);
          speak('Mạng bên em bị chập chờn rồi xếp ơi.');
          return;
        }
        clearTimeout(timeout);

        let data = {};
        try { data = await res.json(); } catch (e) {}
        const apiMessage = (data.error && data.error.message) ? String(data.error.message).slice(0, 160) : '';

        if (res.status === 404) {          // model này không dùng được với key, thử model kế tiếp
          lastError = `${model}: ${apiMessage || 'không tìm thấy model'}`;
          continue;
        }
        if (!res.ok) {
          const detail = `Lỗi ${res.status}${apiMessage ? ': ' + apiMessage : ''}`;
          if (res.status === 400 || res.status === 401 || res.status === 403) speak('API Key chưa đúng hoặc chưa được bật xếp ơi.', detail);
          else if (res.status === 429) speak('Key của xếp hết lượt dùng rồi, xếp chờ một lát nhé.', detail);
          else speak('Bên Gemini đang lỗi rồi xếp ơi.', detail);
          return;
        }

        const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
        const reply = parts.map((p) => p.text || '').join(' ').trim();
        if (reply) {
          localStorage.setItem('gemini_model', model);
          speak(reply);
        } else {
          const why = (data.promptFeedback && data.promptFeedback.blockReason) || (data.candidates && data.candidates[0] && data.candidates[0].finishReason) || 'không có nội dung';
          speak('Em chưa nghĩ ra câu trả lời, xếp hỏi lại giúp em nhé.', `Gemini không trả về chữ: ${why}`);
        }
        return;
      }
      speak('Key này chưa dùng được model nào của Gemini xếp ơi.', lastError);
    }

    // 6. PHÁT ÂM THANH RÕ TIẾNG & TỰ ĐỘNG LẮNG NGHE LẠI
    async function speak(text, detail) {
      const token = ++speakToken;
      isBotSpeaking = true;
      isProcessing = false;
      clearTimeout(silenceTimer);
      recognizedText = "";

      setMode('speaking', `Robot: "${text}"` + (detail ? `\n(${detail})` : ''));

      let finished = false;
      let safety = null;
      const finish = () => {
        if (finished || token !== speakToken) return;
        finished = true;
        clearTimeout(safety);
        currentUtterance = null;
        isBotSpeaking = false;
        if (isContinuousActive) {
          setMode('listening', 'Đang nghe xếp nói...');
          setTimeout(restartListening, 500);
        } else {
          setMode('idle', 'Chạm vào màn hình 1 lần để đánh thức Robot');
        }
      };
      // Phòng khi trình duyệt không bao giờ báo "nói xong"
      safety = setTimeout(finish, Math.max(5000, text.length * 160 + 4000));

      const synth = window.speechSynthesis;
      if (!synth) {
        statusLabel.innerText = 'Trình duyệt này không có giọng nói.';
        setTimeout(finish, 1500);
        return;
      }

      // Micro phải đóng hẳn rồi loa mới được nói
      await stopListeningAndWait();
      await sleep(250);
      if (token !== speakToken) return;

      // Gọi cancel() rồi speak() ngay lập tức làm Chrome trên Android nuốt mất câu nói
      if (synth.speaking || synth.pending) {
        synth.cancel();
        await sleep(200);
        if (token !== speakToken) return;
      }
      try { synth.resume(); } catch (e) {}

      const utterance = new SpeechSynthesisUtterance(text);
      currentUtterance = utterance;
      utterance.lang = 'vi-VN';
      utterance.rate = 0.95;   // Tốc độ vừa phải, rõ từng chữ
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      const voice = pickVietnameseVoice();
      if (voice) {
        utterance.voice = voice;
      } else if ((synth.getVoices() || []).length > 0) {
        // Máy chưa có giọng tiếng Việt thì giọng khác sẽ đọc rất khó nghe
        statusLabel.innerText = `Robot: "${text}"\n(Máy chưa có giọng tiếng Việt. Hãy cài giọng Tiếng Việt trong cài đặt Chuyển văn bản thành giọng nói.)`;
      }

      utterance.onend = finish;
      utterance.onerror = finish;
      synth.speak(utterance);
    }

    // Nút thử loa: nói một câu, không bật micro
    function testSpeaker() {
      if (isBotSpeaking || isProcessing) return;
      unlockSpeech();
      speak('Xin chào xếp, em đang nói thử. Xếp có nghe rõ không ạ?');
    }
  </script>
</body>
</html>
