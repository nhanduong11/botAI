<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Desk Robot AI</title>
  
  <!-- MediaPipe Face Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070a12;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      touch-action: manipulation;
    }

    /* Video camera ngầm */
    #webcam {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* Khung khuôn mặt */
    .face-socket {
      display: flex;
      gap: 60px;
      align-items: center;
      justify-content: center;
      width: 320px;
      height: 220px;
      cursor: pointer;
    }

    /* Đôi mắt robot OLED */
    .eye {
      width: 85px;
      height: 135px;
      background: #00f2fe;
      border-radius: 45px;
      box-shadow: 0 0 25px #00f2fe, 0 0 50px rgba(0, 242, 254, 0.4);
      transition: transform 0.08s ease-out, height 0.15s ease-in-out, background 0.3s;
      will-change: transform;
    }

    /* Chớp mắt */
    .blink {
      height: 12px !important;
    }

    /* Đang nghe: Mắt tròn xanh lá */
    .listening .eye {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #38ef7d;
      box-shadow: 0 0 35px #38ef7d;
    }

    /* Đang suy nghĩ: Mắt dẹt màu vàng */
    .thinking .eye {
      height: 35px;
      background: #fbc531;
      box-shadow: 0 0 30px #fbc531;
    }

    /* Đang nói: Mắt chuyển động nhịp */
    .speaking .eye {
      background: #ff4757;
      box-shadow: 0 0 35px #ff4757;
      animation: speak-pulse 0.4s infinite alternate;
    }

    @keyframes speak-pulse {
      0% { transform: scaleY(0.75); }
      100% { transform: scaleY(1.15); }
    }

    /* Trạng thái văn bản */
    .status-text {
      margin-top: 35px;
      font-size: 16px;
      color: #00f2fe;
      text-align: center;
      max-width: 90%;
      min-height: 55px;
      line-height: 1.5;
      padding: 0 10px;
    }

    /* Khung nhập API Key */
    .config-box {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 8px;
      width: 85%;
      max-width: 420px;
      z-index: 10;
    }
    .config-box input {
      flex: 1;
      background: rgba(30, 39, 46, 0.85);
      border: 1px solid #485460;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .config-box button {
      background: #00f2fe;
      color: #070a12;
      border: none;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Video camera ngầm -->
  <video id="webcam" playsinline autoplay muted></video>

  <!-- Khuôn mặt Robot -->
  <div class="face-socket" id="faceSocket" onclick="startContinuousMode()">
    <div class="eye" id="leftEye"></div>
    <div class="eye" id="rightEye"></div>
  </div>

  <div class="status-text" id="statusLabel">Chạm vào màn hình 1 lần để đánh thức Robot</div>

  <!-- Khung nhập API Key -->
  <div class="config-box">
    <input type="password" id="apiKeyInput" placeholder="Nhập hoặc dán Gemini API Key...">
    <button onclick="saveApiKey()">Lưu Key</button>
  </div>

  <script>
    const webcamElement = document.getElementById('webcam');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const faceSocket = document.getElementById('faceSocket');
    const statusLabel = document.getElementById('statusLabel');
    const apiKeyInput = document.getElementById('apiKeyInput');

    // Tự động load API Key từ bộ nhớ máy (hoặc dùng key mặc định nếu có sẵn)
    const savedKey = localStorage.getItem('gemini_api_key') || "AIzaSyAyeIq90DOaJLbngocB7ie2iY4yiiEJRe4";
    apiKeyInput.value = savedKey;

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        alert('Đã lưu API Key thành công!');
      }
    }

    let currentX = 0;
    let currentY = 0;
    const MAX_OFFSET_X = 35;
    const MAX_OFFSET_Y = 25;

    // 1. TỰ ĐỘNG CHỚP MẮT
    function triggerBlink() {
      if (!faceSocket.classList.contains('speaking') && !faceSocket.classList.contains('thinking')) {
        leftEye.classList.add('blink');
        rightEye.classList.add('blink');
        setTimeout(() => {
          leftEye.classList.remove('blink');
          rightEye.classList.remove('blink');
        }, 160);
      }
      setTimeout(triggerBlink, Math.random() * 4000 + 2500);
    }
    triggerBlink();

    // 2. FACE TRACKING (MEDIAPIPE)
    function onFaceResults(results) {
      if (results.detections && results.detections.length > 0) {
        const bbox = results.detections[0].boundingBox;
        const faceCenterX = bbox.xCenter;
        const faceCenterY = bbox.yCenter;

        const targetOffsetX = (0.5 - faceCenterX) * 2 * MAX_OFFSET_X;
        const targetOffsetY = (faceCenterY - 0.5) * 2 * MAX_OFFSET_Y;

        currentX += (targetOffsetX - currentX) * 0.35;
        currentY += (targetOffsetY - currentY) * 0.35;

        if (!faceSocket.classList.contains('speaking')) {
          const transformValue = `translate(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px)`;
          leftEye.style.transform = transformValue;
          rightEye.style.transform = transformValue;
        }
      } else {
        currentX += (0 - currentX) * 0.1;
        currentY += (0 - currentY) * 0.1;
        if (!faceSocket.classList.contains('speaking')) {
          leftEye.style.transform = `translate(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px)`;
          rightEye.style.transform = `translate(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px)`;
        }
      }
    }

    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({
      model: 'short',
      minDetectionConfidence: 0.5
    });
    faceDetection.onResults(onFaceResults);

    const camera = new Camera(webcamElement, {
      onFrame: async () => {
        await faceDetection.send({ image: webcamElement });
      },
      facingMode: 'user',
      width: 480,
      height: 360
    });

    camera.start().catch((err) => {
      console.warn("Lỗi camera:", err);
    });

    // 3. TỐI ƯU HỆ THỐNG GIỌNG NÓI TIẾNG VIỆT (TTS)
    let vietnameseVoice = null;

    function initVoices() {
      const voices = window.speechSynthesis.getVoices();
      // Tìm giọng tiếng Việt chuẩn của Google hoặc thiết bị
      vietnameseVoice = voices.find(v => v.lang === 'vi-VN' || v.lang === 'vi_VN' || v.lang.includes('vi'));
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    // 4. THU ÂM VÀ LẮNG NGHE LIÊN TỤC
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isBotSpeaking = false;
    let isContinuousActive = false;
    let silenceTimer = null;
    let recognizedText = "";

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.interimResults = true;
      recognition.continuous = true;

      recognition.onstart = () => {
        if (!isBotSpeaking) {
          setMode('listening', 'Đang nghe xếp nói...');
        }
      };

      recognition.onresult = (event) => {
        let currentTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          currentTranscript += event.results[i][0].transcript;
        }

        if (currentTranscript.trim().length > 0) {
          recognizedText = currentTranscript.trim();
          statusLabel.innerText = `Đang nghe: "${recognizedText}"`;

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (recognizedText.length > 0) {
              const textToSend = recognizedText;
              recognizedText = "";
              triggerProcessQuery(textToSend);
            }
          }, 1100);
        }
      };

      recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
          statusLabel.innerText = 'Chưa cấp quyền Micro!';
        }
      };

      recognition.onend = () => {
        if (isContinuousActive && !isBotSpeaking) {
          setTimeout(() => restartListening(), 200);
        }
      };
    }

    function restartListening() {
      if (!isContinuousActive || isBotSpeaking) return;
      try {
        recognition.start();
      } catch (err) {}
    }

    function startContinuousMode() {
      if (!isContinuousActive) {
        isContinuousActive = true;
        speak('Em nghe đây xếp.');
      } else {
        restartListening();
      }
    }

    async function triggerProcessQuery(text) {
      try { recognition.stop(); } catch(e) {}
      setMode('thinking', `Xếp: "${text}"`);
      await callGemini(text);
    }

    function setMode(mode, statusMsg) {
      faceSocket.className = 'face-socket ' + (mode === 'idle' ? '' : mode);
      if (statusMsg) statusLabel.innerText = statusMsg;
    }

    // 5. GỌI GEMINI API
    async function callGemini(prompt) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        speak('Xếp chưa nhập API Key kìa.');
        return;
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const payload = {
        system_instruction: {
          parts: [{ 
            text: "Bạn là một robot để bàn thông minh và lễ phép. Luôn xưng hô gọi người dùng là 'xếp'. Phản hồi cực kỳ ngắn gọn, tự nhiên và súc tích (chỉ từ 1 đến 2 câu ngắn) để đọc rõ ràng qua loa điện thoại." 
          }]
        },
        contents: [{ role: "user", parts: [{ text: prompt }] }]
      };

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Em chưa nghe rõ, xếp nói lại giúp em nhé.";
        speak(reply);
      } catch (e) {
        speak('Mạng bên em bị chập chờn rồi xếp ơi.');
      }
    }

    // 6. PHÁT ÂM THANH RÕ TIẾNG & TỰ ĐỘNG LẮNG NGHE LẠI
    function speak(text) {
      isBotSpeaking = true;
      try { recognition.stop(); } catch(e) {}

      setMode('speaking', `Robot: "${text}"`);

      // Hủy mọi âm thanh tồn đọng trước đó
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'vi-VN';
      utterance.rate = 0.95; // Tốc độ vừa phải, rõ từng chữ
      utterance.pitch = 1.0;
      utterance.volume = 1.0; // Âm lượng tối đa

      if (vietnameseVoice) {
        utterance.voice = vietnameseVoice;
      }

      utterance.onend = () => {
        isBotSpeaking = false;
        setMode('listening', 'Đang nghe xếp nói...');
        setTimeout(() => {
          restartListening();
        }, 400);
      };

      utterance.onerror = () => {
        isBotSpeaking = false;
        restartListening();
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
