<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Desk Robot AI</title>
  
  <!-- MediaPipe Face Detection từ CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070a12;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      touch-action: manipulation;
    }

    /* Video camera ngầm chạy Face Tracking */
    #webcam {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* Khung khuôn mặt */
    .face-socket {
      display: flex;
      gap: 60px;
      align-items: center;
      justify-content: center;
      width: 320px;
      height: 220px;
      cursor: pointer;
    }

    /* Đôi mắt robot OLED */
    .eye {
      width: 85px;
      height: 135px;
      background: #00f2fe;
      border-radius: 45px;
      box-shadow: 0 0 25px #00f2fe, 0 0 50px rgba(0, 242, 254, 0.4);
      transition: transform 0.08s ease-out, height 0.15s ease-in-out, background 0.3s;
      will-change: transform;
    }

    /* Chớp mắt */
    .blink {
      height: 12px !important;
    }

    /* Đang nghe: Mắt tròn xanh lá */
    .listening .eye {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #38ef7d;
      box-shadow: 0 0 35px #38ef7d;
    }

    /* Đang suy nghĩ: Mắt dẹt màu vàng */
    .thinking .eye {
      height: 35px;
      background: #fbc531;
      box-shadow: 0 0 30px #fbc531;
    }

    /* Đang nói: Mắt chuyển động nhịp đập */
    .speaking .eye {
      background: #ff4757;
      box-shadow: 0 0 35px #ff4757;
      animation: speak-pulse 0.4s infinite alternate;
    }

    @keyframes speak-pulse {
      0% { transform: scaleY(0.75); }
      100% { transform: scaleY(1.15); }
    }

    /* Trạng thái văn bản */
    .status-text {
      margin-top: 40px;
      font-size: 16px;
      color: #a4b0be;
      text-align: center;
      max-width: 85%;
      min-height: 48px;
      line-height: 1.5;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <!-- Video ẩn cho Face Tracking -->
  <video id="webcam" playsinline autoplay muted></video>

  <!-- Khuôn mặt Robot -->
  <div class="face-socket" id="faceSocket" onclick="startContinuousMode()">
    <div class="eye" id="leftEye"></div>
    <div class="eye" id="rightEye"></div>
  </div>

  <div class="status-text" id="statusLabel">Chạm vào màn hình 1 lần để đánh thức Robot</div>

  <script>
    // GẮN SẴN GEMINI API KEY
    const GEMINI_API_KEY = "AIzaSyAyeIq90DOaJLbngocB7ie2iY4yiiEJRe4";

    const webcamElement = document.getElementById('webcam');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const faceSocket = document.getElementById('faceSocket');
    const statusLabel = document.getElementById('statusLabel');

    let currentX = 0;
    let currentY = 0;
    const MAX_OFFSET_X = 35;
    const MAX_OFFSET_Y = 25;

    // 1. TỰ ĐỘNG CHỚP MẮT
    function triggerBlink() {
      if (!faceSocket.classList.contains('speaking') && !faceSocket.classList.contains('thinking')) {
        leftEye.classList.add('blink');
        rightEye.classList.add('blink');
        setTimeout(() => {
          leftEye.classList.remove('blink');
          rightEye.classList.remove('blink');
        }, 160);
      }
      setTimeout(triggerBlink, Math.random() * 4000 + 2500);
    }
    triggerBlink();

    // 2. FACE TRACKING (MEDIAPIPE)
    function onFaceResults(results) {
      if (results.detections && results.detections.length > 0) {
        const bbox = results.detections[0].boundingBox;
        const faceCenterX = bbox.xCenter;
        const faceCenterY = bbox.yCenter;

        // Tính tọa độ liếc mắt theo gương
        const targetOffsetX = (0.5 - faceCenterX) * 2 * MAX_OFFSET_X;
        const targetOffsetY = (faceCenterY - 0.5) * 2 * MAX_OFFSET_Y;

        currentX += (targetOffsetX - currentX) * 0.35;
        currentY += (targetOffsetY - currentY) * 0.35;

        if (!faceSocket.classList.contains('speaking')) {
          const transformValue = `translate(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px)`;
          leftEye.style.transform = transformValue;
          rightEye.style.transform = transformValue;
        }
      } else {
        currentX += (0 - currentX) * 0.1;
        currentY += (0 - currentY) * 0.1;
        if (!faceSocket.classList.contains('speaking')) {
          leftEye.style.transform = `translate(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px)`;
          rightEye.style.transform = `translate(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px)`;
        }
      }
    }

    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({
      model: 'short',
      minDetectionConfidence: 0.5
    });
    faceDetection.onResults(onFaceResults);

    // Kích hoạt camera trước
    const camera = new Camera(webcamElement, {
      onFrame: async () => {
        await faceDetection.send({ image: webcamElement });
      },
      facingMode: 'user',
      width: 480,
      height: 360
    });

    camera.start().catch((err) => {
      console.warn("Lỗi camera:", err);
    });

    // 3. THU ÂM & ĐÀM THOẠI RẢNH TAY LIÊN TỤC (TỐI ƯU CHO ANDROID CHROME)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isBotSpeaking = false;
    let isContinuousActive = false;
    let silenceTimer = null;
    let recognizedText = "";

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.interimResults = true; // Bắt tiếng tức thì theo thời gian thực
      recognition.continuous = true;     // Giữ mic không bị ngắt quãng

      recognition.onstart = () => {
        if (!isBotSpeaking) {
          setMode('listening', 'Đang nghe xếp nói...');
        }
      };

      recognition.onresult = (event) => {
        let currentTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          currentTranscript += event.results[i][0].transcript;
        }

        if (currentTranscript.trim().length > 0) {
          recognizedText = currentTranscript.trim();
          statusLabel.innerText = `Đang nghe: "${recognizedText}"`;

          // Tự động chốt câu khi người dùng ngừng nói 1.2 giây
          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (recognizedText.length > 0) {
              const textToSend = recognizedText;
              recognizedText = "";
              triggerProcessQuery(textToSend);
            }
          }, 1200);
        }
      };

      recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
          statusLabel.innerText = 'Chưa cấp quyền Micro! Bấm vào biểu tượng cài đặt cạnh link để mở.';
        }
      };

      recognition.onend = () => {
        if (isContinuousActive && !isBotSpeaking) {
          setTimeout(() => restartListening(), 200);
        }
      };
    }

    function restartListening() {
      if (!isContinuousActive || isBotSpeaking) return;
      try {
        recognition.start();
      } catch (err) {}
    }

    function startContinuousMode() {
      if (!isContinuousActive) {
        isContinuousActive = true;

        // Mở khóa âm thanh trình duyệt
        const unlockAudio = new SpeechSynthesisUtterance('Em nghe đây xếp');
        unlockAudio.lang = 'vi-VN';
        unlockAudio.rate = 1.1;
        unlockAudio.onend = () => {
          restartListening();
        };
        window.speechSynthesis.speak(unlockAudio);

        setMode('listening', 'Robot đã sẵn sàng! Mời xếp nói...');
      } else {
        // Nếu chạm lại khi đang chạy -> khởi động lại mic nếu bị kẹt
        restartListening();
      }
    }

    async function triggerProcessQuery(text) {
      try { recognition.stop(); } catch(e) {}
      setMode('thinking', `Xếp: "${text}"`);
      await callGemini(text);
    }

    function setMode(mode, statusMsg) {
      faceSocket.className = 'face-socket ' + (mode === 'idle' ? '' : mode);
      if (statusMsg) statusLabel.innerText = statusMsg;
    }

    // 4. GỌI GEMINI API
    async function callGemini(prompt) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      const payload = {
        system_instruction: {
          parts: [{ 
            text: "Bạn là một robot để bàn thông minh và lễ phép. Luôn xưng hô gọi người dùng là 'xếp'. Phản hồi cực kỳ ngắn gọn, tự nhiên và súc tích (chỉ từ 1 đến 2 câu ngắn) để phù hợp nói chuyện trực tiếp." 
          }]
        },
        contents: [{ role: "user", parts: [{ text: prompt }] }]
      };

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Em chưa nghe rõ, xếp nói lại giúp em nhé.";
        speak(reply);
      } catch (e) {
        speak('Mạng bên em bị chập chờn rồi xếp ơi.');
      }
    }

    // 5. PHÁT ÂM THANH & TỰ ĐỘNG LẮNG NGHE LẠI
    function speak(text) {
      isBotSpeaking = true;
      try { recognition.stop(); } catch(e) {}

      setMode('speaking', text);

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'vi-VN';
      utterance.rate = 1.05;

      utterance.onend = () => {
        isBotSpeaking = false;
        setMode('listening', 'Đang nghe xếp nói...');
        // Chờ 400ms dứt tiếng loa rồi bật lại micro
        setTimeout(() => {
          restartListening();
        }, 400);
      };

      utterance.onerror = () => {
        isBotSpeaking = false;
        restartListening();
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
